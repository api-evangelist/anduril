        relativePath:
          type: string
          description: The path, relative to the environment base URL, where media related to an entity can be accessed
      title: MediaItem
    Correlation:
      type: object
      properties:
        primary:
          $ref: '#/components/schemas/PrimaryCorrelation'
          description: "This entity is the primary of a correlation meaning that it serves as the representative\n entity of the correlation set."
        secondary:
          $ref: '#/components/schemas/SecondaryCorrelation'
          description: "This entity is a secondary of a correlation meaning that it will be represented by the\n primary of the correlation set."
        membership:
          $ref: '#/components/schemas/CorrelationMembership'
          description: If present, this entity is a part of a correlation set.
        decorrelation:
          $ref: '#/components/schemas/Decorrelation'
          description: "If present, this entity was explicitly decorrelated from one or more entities.\n An entity can be both correlated and decorrelated as long as they are disjoint sets.\n An example would be if a user in the UI decides that two tracks are not actually the\n same despite an automatic correlator having correlated them. The user would then\n decorrelate the two tracks and this decorrelation would be preserved preventing the\n correlator from re-correlating them at a later time."
      description: "Available for Entities that are a correlated (N to 1) set of entities. This will be present on\n each entity in the set."
      title: Correlation
