openapi: 3.2.0
info:
  title: REST Entities API
  version: 1.0.0
  description: The Entities API
servers:
- url: https://example.developer.anduril.com
  description: https://{server}
tags:
- name: Entities
  description: The Entities API
paths:
  /api/v1/entities:
    put:
      operationId: entities_publishEntity
      summary: Publish entity
      description: 'Publish an entity for ingest into the Entities API. Entities created with this method are "owned" by the originator: other sources,

        such as the UI, may not edit or delete these entities. The server validates entities at API call time and

        returns an error if the entity is invalid.


        An entity ID must be provided when calling this endpoint. If the entity referenced by the entity ID does not exist

        then it will be created. Otherwise the entity will be updated. An entity will only be updated if its

        provenance.sourceUpdateTime is greater than the provenance.sourceUpdateTime of the existing entity.'
      tags:
      - Entities
      responses:
        '200':
          description: The request was valid and accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized to access resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Entity'
      security:
      - OAuth: []
  /api/v1/entities/{entityId}:
    get:
      operationId: entities_getEntity
      summary: Get entity
      tags:
      - Entities
      parameters:
      - name: entityId
        in: path
        description: ID of the entity to return
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Entity retrieval was successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized to access resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The specified resource was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - OAuth: []
  /api/v1/entities/{entityId}/override/{fieldPath}:
    put:
      operationId: entities_overrideEntity
      summary: Override entity
      description: 'Only fields marked with overridable can be overridden. Please refer to our documentation to see the comprehensive

        list of fields that can be overridden. The entity in the request body should only have a value set on the field

        specified in the field path parameter. Field paths are rooted in the base entity object and must be represented

        using lower_snake_case. Do not include "entity" in the field path.


        Note that overrides are applied in an eventually consistent manner. If multiple overrides are created

        concurrently for the same field path, the last writer wins.'
      tags:
      - Entities
      parameters:
      - name: entityId
        in: path
        description: The unique ID of the entity to override
        required: true
        schema:
          type: string
      - name: fieldPath
        in: path
        description: fieldPath to override
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The Entities API accepts the override.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized to access resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The specified resource was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityOverride'
      security:
      - OAuth: []
    delete:
      operationId: entities_removeEntityOverride
      summary: Delete entity override
      description: This operation clears the override value from the specified field path on the entity.
      tags:
      - Entities
      parameters:
      - name: entityId
        in: path
        description: The unique ID of the entity to undo an override from.
        required: true
        schema:
          type: string
      - name: fieldPath
        in: path
        description: The fieldPath to clear overrides from.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The removal of entity override was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized to access resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The specified resource was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - OAuth: []
  /api/v1/entities/events:
    post:
      operationId: entities_longPollEntityEvents
      summary: Poll entity events
      description: 'This is a long polling API that will first return all pre-existing data and then return all new data as

        it becomes available. If you want to start a new polling session then open a request with an empty

        ''sessionToken'' in the request body. The server will return a new session token in the response.

        If you want to retrieve the next batch of results from an existing polling session then send the session

        token you received from the server in the request body. If no new data is available then the server will

        hold the connection open for up to 5 minutes. After the 5 minute timeout period, the server will close the

        connection with no results and you may resume polling with the same session token. If your session falls behind

        more than 3x the total number of entities in the environment, the server will terminate your session.

        In this case you must start a new session by sending a request with an empty session token.'
      tags:
      - Entities
      responses:
        '200':
          description: Entity event batch retrieval was successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityEventResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized to access resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The specified resource was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '408':
          description: 'The server has terminated the session. The server will send this error when the client has fallen too far

            behind in processing entity events. If the server sends this error, then the session token is invalid and a

            new session must be initiated to receive entity events.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Server is out of resources or reaching rate limiting or quota and cannot accept the request at this time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityEventRequest'
      security:
      - OAuth: []
  /api/v1/entities/stream:
    post:
      operationId: entities_streamEntities
      summary: Stream entity events
      description: 'Establishes a server-sent events (SSE) connection that streams entity data in real-time.

        This is a one-way connection from server to client that follows the SSE protocol with text/event-stream content type.


        This endpoint enables clients to maintain a real-time view of the common operational picture (COP)

        by first streaming all pre-existing entities that match filter criteria, then continuously delivering

        updates as entities are created, modified, or deleted.


        The server first sends events with type PREEXISTING for all live entities matching the filter that existed before the stream was open,

        then streams CREATE events for newly created entities, UPDATE events when existing entities change, and DELETED events when entities are removed. The stream remains open

        indefinitely unless preExistingOnly is set to true.


        Heartbeat messages can be configured to maintain connection health and detect disconnects by setting the heartbeatIntervalMS

        parameter. These heartbeats help keep the connection alive and allow clients to verify the server is still responsive.


        Clients can optimize bandwidth usage by specifying which entity components they need populated using the componentsToInclude parameter.

        This allows receiving only relevant data instead of complete entities.


        The connection automatically recovers from temporary disconnections, resuming the stream where it left off. Unlike polling approaches,

        this provides real-time updates with minimal latency and reduced server load.'
      tags:
      - Entities
      responses:
        '200':
          description: Returns all pre-existing data and then return all new data as they become available.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Entities_streamEntities_Response_200'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized to access resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityStreamRequest'
      security:
      - OAuth: []
components:
  schemas:
    PrimaryMembership:
      type: object
      properties: {}
      title: PrimaryMembership
    EntityManager.Pose:
      type: object
      properties:
        pos:
          $ref: '#/components/schemas/Position'
          description: Geospatial location defined by this Pose.
        orientation:
          $ref: '#/components/schemas/Quaternion'
          description: "The quaternion to transform a point in the Pose frame to the ENU frame. The Pose frame could be Body, Turret,\n etc and is determined by the context in which this Pose is used.\n The normal convention for defining orientation is to list the frames of transformation, for example\n att_gimbal_to_enu is the quaternion which transforms a point in the gimbal frame to the body frame, but\n in this case we truncate to att_enu because the Pose frame isn't defined. A potentially better name for this\n field would have been att_pose_to_enu.\n\n Implementations of this quaternion should left multiply this quaternion to transform a point from the Pose frame\n to the enu frame."
      title: EntityManager.Pose
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
      title: Error
    ActiveTarget:
      type: object
      properties: {}
      description: "A target relationship is the inverse of TrackedBy; a one-way relation\n from sensor to target, indicating track(s) currently prioritized by a robot."
      title: ActiveTarget
    Pose:
      type: object
      properties:
        pos:
          $ref: '#/components/schemas/LLA'
          description: Geospatial location defined by this Pose.
        attEnu:
          $ref: '#/components/schemas/Quaternion'
          description: "The quaternion to transform a point in the Pose frame to the ENU frame. The Pose frame could be Body, Turret,\n etc and is determined by the context in which this Pose is used.\n The normal convention for defining orientation is to list the frames of transformation, for example\n att_gimbal_to_enu is the quaternion which transforms a point in the gimbal frame to the body frame, but\n in this case we truncate to att_enu because the Pose frame isn't defined. A potentially better name for this\n field would have been att_pose_to_enu.\n\n Implementations of this quaternion should left multiply this quaternion to transform a point from the Pose frame\n to the enu frame.\n\n Point<Pose\\> posePt{1,0,0};\n Rotation<Enu, Pose\\> attPoseToEnu{};\n Point<Enu\\> = attPoseToEnu*posePt;\n\n This transformed point represents some vector in ENU space that is aligned with the x axis of the attPoseToEnu\n matrix.\n\n An alternative matrix expression is as follows:\n ptEnu = M x ptPose"
      title: Pose
    AltitudeProvenance:
      type: object
      properties:
        sourceType:
          $ref: '#/components/schemas/AltitudeProvenanceSourceType'
      title: AltitudeProvenance
    AltitudeAboveStandardDatumPlanePressure:
      type: object
      properties:
        provenance:
          $ref: '#/components/schemas/AltitudeProvenance'
          description: The provenance of the measurement.
        valueMeters:
          type: number
          format: double
          description: The altitude value in meters.
      description: "The altitude reading measured above the standard datum plane (29.92 inHg or 1013.2 hPA). This is also known as\n pressure altitude or QNE in aviation terms. This altitude should be used when flying at high altitudes and\n above the transition level (18,000 in the USA and Canada), ensuring the use of a common reference altitude."
      title: AltitudeAboveStandardDatumPlanePressure
    PowerSource:
      type: object
      properties:
        powerStatus:
          $ref: '#/components/schemas/PowerSourcePowerStatus'
          description: Status of the power source.
        powerType:
          $ref: '#/components/schemas/PowerSourcePowerType'
          description: Used to determine the type of power source.
        powerLevel:
          $ref: '#/components/schemas/PowerLevel'
          description: Power level of the system. If absent, the power level is assumed to be unknown.
        messages:
          type: array
          items:
            type: string
          description: "Set of human-readable messages with status of the power system. Typically this would be used in an error state\n to provide additional error information. This can also be used for informational messages."
        offloadable:
          type: boolean
          description: "Whether the power source is offloadable. If the value is missing (as opposed to false) then the entity does not\n report whether the power source is offloadable."
      description: Represents the state of a single power source that is connected to this entity.
      title: PowerSource
    AltitudeAboveGroundLevel:
      type: object
      properties:
        provenance:
          $ref: '#/components/schemas/AltitudeProvenance'
          description: The provenance of the measurement.
        valueMeters:
          type: number
          format: double
          description: The altitude value in meters.
      description: Altitude as AGL (Above ground level). This is also known as absolute altitude or QFE in aviation terms.
      title: AltitudeAboveGroundLevel
    LLA:
      type: object
      properties:
        lon:
          type: number
          format: double
        lat:
          type: number
          format: double
        alt:
          type: number
          format: double
        is2d:
          type: boolean
        altitudeReference:
          $ref: '#/components/schemas/LlaAltitudeReference'
          description: "Meaning of alt.\n altitude in meters above either WGS84 or EGM96, use altitude_reference to\n determine what zero means."
      title: LLA
    HeadingType:
      type: object
      properties:
        value:
          type: integer
      description: "The HeadingType represents the heading in degrees for an entity's\n attitudeEnu quaternion to be compared against. Defaults between a range of 0 to 360"
      title: HeadingType
    PredicateComparator:
      type: string
      enum:
      - COMPARATOR_INVALID
      - COMPARATOR_MATCH_ALL
      - COMPARATOR_EQUALITY
      - COMPARATOR_IN
      - COMPARATOR_LESS_THAN
      - COMPARATOR_GREATER_THAN
      - COMPARATOR_LESS_THAN_EQUAL_TO
      - COMPARATOR_GREATER_THAN_EQUAL_TO
      - COMPARATOR_WITHIN
      - COMPARATOR_EXISTS
      - COMPARATOR_CASE_INSENSITIVE_EQUALITY
      - COMPARATOR_CASE_INSENSITIVE_EQUALITY_IN
      - COMPARATOR_RANGE_CLOSED
      description: "The comparator determines the manner in which the entity field and static value are compared.\n Comparators may only be applied to certain values. For example, the WITHIN comparator cannot\n be used for a boolean value comparison."
      title: PredicateComparator
    Agent:
      type: object
      properties:
        entityId:
          type: string
          description: Entity ID of the agent.
      description: Represents an agent capable of processing tasks.
      title: Agent
    EntityStreamEventEvent:
      type: string
      enum:
      - entity
      title: EntityStreamEventEvent
    TimestampType:
      type: object
      properties:
        value:
          type: string
          format: date-time
      description: The TimestampType represents a static timestamp value.
      title: TimestampType
    CronWindow:
      type: object
      properties:
        cronExpression:
          type: string
          description: "in UTC, describes when and at what cadence this window starts, in the quartz flavor of cron\n\n examples:\n    This schedule is begins at 7:00:00am UTC everyday between Monday and Friday\n        0 0 7 ? * MON-FRI *\n    This schedule begins every 5 minutes starting at 12:00:00pm UTC until 8:00:00pm UTC everyday\n        0 0/5 12-20 * * ? *\n    This schedule begins at 12:00:00pm UTC on March 2nd 2023\n        0 0 12 2 3 ? 2023"
        durationMillis:
          type: string
          description: describes the duration
      title: CronWindow
    GeoEllipsoid:
      type: object
      properties:
        forwardAxisM:
          type: number
          format: double
          description: Defines the distance from the center point to the surface along the forward axis
        sideAxisM:
          type: number
          format: double
          description: Defines the distance from the center point to the surface along the side axis
        upAxisM:
          type: number
          format: double
          description: Defines the distance from the center point to the surface along the up axis
      description: "An ellipsoid shaped geo-entity.\n Principal axis lengths are defined in entity body space\n This shape is NOT Geo-JSON compatible."
      title: GeoEllipsoid
    ACMDetails:
      type: object
      properties:
        acmType:
          $ref: '#/components/schemas/AcmDetailsAcmType'
        acmDescription:
          type: string
          description: "Used for loosely typed associations, such as assignment to a specific fires unit.\n Limit to 150 characters."
      title: ACMDetails
    Mode5Mode5InterrogationResponse:
      type: string
      enum:
      - INTERROGATION_RESPONSE_INVALID
      - INTERROGATION_RESPONSE_CORRECT
      - INTERROGATION_RESPONSE_INCORRECT
      - INTERROGATION_RESPONSE_NO_RESPONSE
      description: The validity of the response from the Mode 5 interrogation.
      title: Mode5Mode5InterrogationResponse
    LocationGeocentricECEF:
      type: object
      properties:
        xMeters:
          type: number
          format: double
          description: "The plane of the equator, passing through extending from 90°W longitude (negative)\n to 90°E longitude (positive)."
        yMeters:
          type: number
          format: double
          description: "The plane of the equator, passing through the origin and extending from 180° longitude\n (negative) to the prime meridian."
        zMeters:
          type: number
          format: double
          description: The line between the North and South Poles, with positive values increasing northward.
      description: "Location measurement in reference to the center of the earth using the ECEF\n coordinate system. This is in the WGS84 coordinate frame."
      title: LocationGeocentricECEF
    Override:
      type: object
      properties:
        requestId:
          type: string
          description: override request id for an override request
        fieldPath:
          type: string
          description: "proto field path which is the string representation of a field.\n example: correlated.primary_entity_id would be primary_entity_id in correlated component"
        maskedFieldValue:
          $ref: '#/components/schemas/Entity'
          description: "new field value corresponding to field path. In the shape of an empty entity with only the changed value.\n example: entity: { mil_view: { disposition: Disposition_DISPOSITION_HOSTILE } }"
        status:
          $ref: '#/components/schemas/OverrideStatus'
          description: status of the override
        provenance:
          $ref: '#/components/schemas/Provenance'
        type:
          $ref: '#/components/schemas/OverrideType'
          description: "The type of the override, defined by the stage of the entity lifecycle that the entity was in when the override\n was requested."
        requestTimestamp:
          type: string
          format: date-time
          description: Timestamp of the override request. The timestamp is generated by the Entity Manager instance that receives the request.
      description: Details about an override. Last write wins.
      title: Override
    Dimensions:
      type: object
      properties:
        lengthM:
          type: string
          title: float
          description: Length of the entity in meters
      title: Dimensions
    RFConfiguration:
      type: object
      properties:
        frequencyRangeHz:
          type: array
          items:
            $ref: '#/components/schemas/FrequencyRange'
          description: Frequency ranges that are available for this sensor.
        bandwidthRangeHz:
          type: array
          items:
            $ref: '#/components/schemas/BandwidthRange'
          description: Bandwidth ranges that are available for this sensor.
      description: Represents RF configurations supported on this sensor.
      title: RFConfiguration
    Kinematics:
      type: object
      properties:
        kinematicsGeodetic:
          $ref: '#/components/schemas/KinematicsGeodetic'
          description: Kinematics measured in a geodetic (WGS84 latitude/longitude/altitude and ENU) reference frame.
        kinematicsGeocentric:
          $ref: '#/components/schemas/KinematicsGeocentric'
          description: Kinematics measured in a geocentric (ECEF) reference frame.
      description: "Kinematics of the entity, including its location, location uncertainty, motion, attitude, and the time the\n kinematics were measured.\n\n Only one of the fields on this message is expected to be set when publishing an entity."
      title: Kinematics
    LocationGeodetic:
      type: object
      properties:
        latitudeDegrees:
          type: number
          format: double
          description: WGS84 latitude in decimal degrees.
        longitudeDegrees:
          type: number
          format: double
          description: WGS84 longitude in decimal degrees.
        universalAltitudeHae:
          $ref: '#/components/schemas/AltitudeAboveWGS84Ellipsoid'
          description: "Altitude measurement in reference to the WGS84 defined ellipsoid. This is expected to\n always be set if an altitude measurement is available and should be derived from the\n most accurate altitude measurement available. If this is a 2D measurement, then this\n message should not be set. If you are unable to calculate this value, then this\n message should also not be set."
        additionalAltitudes:
          type: array
          items:
            $ref: '#/components/schemas/Altitude'
          description: "This allows for multiple additional altitudes to be conveyed.\n e.g. Barometric Pressure and Radar Altimeter readings\n for an aircraft"
      description: "Geodetic location measurement in reference to the WGS84 ellipsoid. This also optionally\n provides other altitude reference frames."
      title: LocationGeodetic
    ModeS:
      type: object
      properties:
        id:
          type: string
          description: Mode S identifier which comprises of 8 alphanumeric characters.
        address:
          type: integer
          format: uint
          description: "The Mode S ICAO aircraft address. Expected values are between 1 and 16777214 decimal. The Mode S address is\n considered unique."
      description: Describes the Mode S codes.
      title: ModeS
    HealthConnectionStatus:
      type: string
      enum:
      - CONNECTION_STATUS_INVALID
      - CONNECTION_STATUS_ONLINE
      - CONNECTION_STATUS_OFFLINE
      description: Status indicating whether the entity is able to communicate with Entity Manager.
      title: HealthConnectionStatus
    SensorSensorType:
      type: string
      enum:
      - SENSOR_TYPE_INVALID
      - SENSOR_TYPE_RADAR
      - SENSOR_TYPE_CAMERA
      - SENSOR_TYPE_TRANSPONDER
      - SENSOR_TYPE_RF
      - SENSOR_TYPE_GPS
      - SENSOR_TYPE_PTU_POS
      - SENSOR_TYPE_PERIMETER
      - SENSOR_TYPE_SONAR
      description: The type of sensor
      title: SensorSensorType
    UInt32Range:
      type: object
      properties:
        lowerBound:
          type: integer
          format: uint
        upperBound:
          type: integer
          format: uint
      title: UInt32Range
    ClassificationInformation:
      type: object
      properties:
        level:
          $ref: '#/components/schemas/ClassificationInformationLevel'
          description: Classification level to be applied to the information in question.
        caveats:
          type: array
          items:
            type: string
          description: Caveats that may further restrict how the information can be disseminated.
      description: "Represents all of the necessary information required to generate a summarized\n classification marking.\n\n > example: A summarized classification marking of \"TOPSECRET//NOFORN//FISA\"\n            would be defined as: { \"level\": 5, \"caveats\": [ \"NOFORN, \"FISA\" ] }"
      title: ClassificationInformation
    ComponentHealth:
      type: object
      properties:
        id:
          type: string
          description: Consistent internal ID for this component.
        name:
          type: string
          description: Display name for this component.
        health:
          $ref: '#/components/schemas/ComponentHealthHealth'
          description: Health for this component.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ComponentMessage'
          description: Human-readable describing the component state. These messages should be understandable by end users.
        updateTime:
          type: string
          format: date-time
          description: "The last update time for this specific component.\n If this timestamp is unset, the data is assumed to be most recent"
      description: Health of an individual component.
      title: ComponentHealth
    TransponderCodes:
      type: object
      properties:
        mode1:
          type: integer
          format: uint
          description: The mode 1 code assigned to military assets.
        mode2:
          type: integer
          format: uint
          description: The Mode 2 code assigned to military assets.
        mode3:
          type: integer
          format: uint
          description: The Mode 3 code assigned by ATC to the asset.
        mode4InterrogationResponse:
          $ref: '#/components/schemas/TransponderCodesMode4InterrogationResponse'
          description: The validity of the response from the Mode 4 interrogation.
        mode5:
          $ref: '#/components/schemas/Mode5'
          description: The Mode 5 transponder codes.
        modeS:
          $ref: '#/components/schemas/ModeS'
          description: The Mode S transponder codes.
        modeCAltitudeFt:
          type: integer
          description: "The Mode C altitude reported by the transponder in feet. Mode C provides pressure altitude in 100-foot increments up\n to 10,000 feet MSL. Valid altitudes include 0 ft (sea level). An unset field indicates no Mode C response was received."
      description: A message describing any transponder codes associated with Mode 1, 2, 3, 4, 5, S, C interrogations.
      title: TransponderCodes
    RouteDetails:
      type: object
      properties:
        destinationName:
          type: string
          description: Free form text giving the name of the entity's destination
        estimatedArrivalTime:
          type: string
          format: date-time
          description: Estimated time of arrival at destination
      title: RouteDetails
    GeoVisualDetails:
      type: object
      properties:
        fillColor:
          $ref: '#/components/schemas/Color'
          description: Describes the fill color of a geo-entity.
        lineColor:
          $ref: '#/components/schemas/Color'
