      properties:
        highValueTarget:
          $ref: '#/components/schemas/HighValueTarget'
          description: Describes the target priority in relation to high value target lists.
        threat:
          $ref: '#/components/schemas/Threat'
          description: Describes whether the entity should be treated as a threat
      description: The target prioritization associated with an entity.
      title: TargetPriority
    Ontology:
      type: object
      properties:
        platformType:
          type: string
          description: A string that describes the entity's high-level type with natural language.
        specificType:
          type: string
          description: A string that describes the entity's exact model or type.
        template:
          $ref: '#/components/schemas/OntologyTemplate'
          description: The template used when creating this entity. Specifies minimum required components.
      description: Ontology of the entity.
      title: Ontology
    AltitudeAboveMeanSeaLevelPressure:
      type: object
      properties:
        provenance:
          $ref: '#/components/schemas/AltitudeProvenance'
          description: The provenance of the measurement.
        valueMeters:
          type: number
          format: double
          description: The altitude value in meters.
      description: "The calibrated pressure altitude reading measured above MSL. This is known as QNH or true altitude in aviation\n terms. This is separated from AltitudeAboveMeanSeaLevelEGM96, as the two values are not guaranteed to be the\n same due to temperature fluctuations."
      title: AltitudeAboveMeanSeaLevelPressure
    GeoPoint:
      type: object
      properties:
        position:
          $ref: '#/components/schemas/Position'
      description: "A point shaped geo-entity.\n See https://datatracker.ietf.org/doc/html/rfc7946#section-3.1.2"
      title: GeoPoint
    Quaternion:
      type: object
      properties:
        x:
          type: number
          format: double
          description: x, y, z are vector portion, w is scalar
        y:
          type: number
          format: double
        z:
          type: number
          format: double
        w:
          type: number
          format: double
      title: Quaternion
    EnumType:
      type: object
      properties:
        value:
          type: integer
      description: "The EnumType represents members of well-known anduril ontologies, such as \"disposition.\" When\n such a value is specified, the evaluation library expects the integer representation of the enum\n value. For example, a disposition derived from ontology.v1 such as \"DISPOSITION_HOSTILE\" should be\n represented with the integer value 2."
      title: EnumType
    Media:
      type: object
      properties:
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'
      description: Media associated with an entity.
      title: Media
    Bandwidth:
      type: object
      properties:
        bandwidthHz:
          type: number
          format: double
      description: Describes the bandwidth of a signal
      title: Bandwidth
    Relationship:
      type: object
      properties:
        relatedEntityId:
          type: string
          description: The entity ID to which this entity is related.
        relationshipId:
          type: string
          description: A unique identifier for this relationship. Allows removing or updating relationships.
        relationshipType:
          $ref: '#/components/schemas/RelationshipType'
          description: The relationship type
      description: The relationship component indicates a relationship to another entity.
      title: Relationship
    Statement:
      type: object
      properties:
        and:
          $ref: '#/components/schemas/AndOperation'
        or:
          $ref: '#/components/schemas/OrOperation'
        not:
          $ref: '#/components/schemas/NotOperation'
        list:
          $ref: '#/components/schemas/ListOperation'
        predicate:
          $ref: '#/components/schemas/Predicate'
      description: "A Statement is the building block of the entity filter. The outermost statement is conceptually\n the root node of an \"expression tree\" which allows for the construction of complete boolean\n logic statements. Statements are formed by grouping sets of children statement(s) or predicate(s)\n according to the boolean operation which is to be applied.\n\n For example, the criteria \"take an action if an entity is hostile and an air vehicle\" can be\n represented as: Statement1: { AndOperation: { Predicate1, Predicate2 } }. Where Statement1\n is the root of the expression tree, with an AND operation that is applied to children\n predicates. The predicates themselves encode \"entity is hostile\" and \"entity is air vehicle.\""
      title: Statement
    GeoLine:
      type: object
      properties:
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'
      description: "A line shaped geo-entity.\n See https://datatracker.ietf.org/doc/html/rfc7946#section-3.1.4"
      title: GeoLine
    StringType:
      type: object
      properties:
        value:
          type: string
      description: The StringType represents static string values.
      title: StringType
    ScanCharacteristicsScanType:
      type: string
      enum:
      - SCAN_TYPE_INVALID
      - SCAN_TYPE_CIRCULAR
      - SCAN_TYPE_BIDIRECTIONAL_HORIZONTAL_SECTOR
      - SCAN_TYPE_BIDIRECTIONAL_VERTICAL_SECTOR
      - SCAN_TYPE_NON_SCANNING
      - SCAN_TYPE_IRREGULAR
      - SCAN_TYPE_CONICAL
      - SCAN_TYPE_LOBE_SWITCHING
      - SCAN_TYPE_RASTER
      - SCAN_TYPE_CIRCULAR_VERTICAL_SECTOR
      - SCAN_TYPE_CIRCULAR_CONICAL
      - SCAN_TYPE_SECTOR_CONICAL
      - SCAN_TYPE_AGILE_BEAM
      - SCAN_TYPE_UNIDIRECTIONAL_VERTICAL_SECTOR
      - SCAN_TYPE_UNIDIRECTIONAL_HORIZONTAL_SECTOR
      - SCAN_TYPE_UNIDIRECTIONAL_SECTOR
      - SCAN_TYPE_BIDIRECTIONAL_SECTOR
      title: ScanCharacteristicsScanType
    TMat2:
      type: object
      properties:
        mxx:
          type: number
          format: double
        mxy:
          type: number
          format: double
        myy:
          type: number
          format: double
      description: "symmetric 2d matrix only representing the upper right triangle, useful for\n covariance matrices"
      title: TMat2
    RangeRings:
      type: object
      properties:
        minDistanceM:
          type: number
          format: double
          description: The minimum range ring distance, specified in meters.
        maxDistanceM:
          type: number
          format: double
          description: The maximum range ring distance, specified in meters.
        ringCount:
          type: integer
          format: uint
          description: The count of range rings.
        ringLineColor:
          $ref: '#/components/schemas/Color'
          description: The color of range rings, specified in hex string.
      description: Range rings allow visual assessment of map distance at varying zoom levels.
      title: RangeRings
    Sensors:
      type: object
      properties:
        sensors:
          type: array
          items:
            $ref: '#/components/schemas/Sensor'
      description: List of sensors available for an entity.
      title: Sensors
    Aliases:
      type: object
      properties:
        alternateIds:
          type: array
          items:
            $ref: '#/components/schemas/AlternateId'
        name:
          type: string
          description: The best available version of the entity's display name.
      description: Available for any Entities with alternate ids in other systems.
      title: Aliases
    Health:
      type: object
      properties:
        connectionStatus:
          $ref: '#/components/schemas/HealthConnectionStatus'
          description: Status indicating whether the entity is able to communicate with Entity Manager.
        healthStatus:
          $ref: '#/components/schemas/HealthHealthStatus'
          description: Top-level health status; typically a roll-up of individual component healths.
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentHealth'
          description: Health of individual components running on this Entity.
        updateTime:
          type: string
          format: date-time
          description: "The update time for the top-level health information.\n If this timestamp is unset, the data is assumed to be most recent"
        activeAlerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
          description: "Active alerts indicate a critical change in system state sent by the asset\n that must be made known to an operator or consumer of the common operating picture.\n Alerts are different from ComponentHealth messages--an active alert does not necessarily\n indicate a component is in an unhealthy state. For example, an asset may trigger\n an active alert based on fuel levels running low. Alerts should be removed from this list when their conditions\n are cleared. In other words, only active alerts should be reported here."
      description: General health of the entity as reported by the entity.
      title: Health
    LineOfBearing:
      type: object
      properties:
        angleOfArrival:
          $ref: '#/components/schemas/AngleOfArrival'
          description: The direction pointing from this entity to the detection
        rangeEstimateM:
          $ref: '#/components/schemas/Measurement'
          description: The estimated distance of the detection
        maxRangeM:
          $ref: '#/components/schemas/Measurement'
          description: The maximum distance of the detection
      description: A line of bearing of a signal.
      title: LineOfBearing
    OverrideType:
      type: string
      enum:
      - OVERRIDE_TYPE_INVALID
      - OVERRIDE_TYPE_LIVE
      - OVERRIDE_TYPE_POST_EXPIRY
      description: "The type of the override, defined by the stage of the entity lifecycle that the entity was in when the override\n was requested."
      title: OverrideType
    Threat:
      type: object
      properties:
        isThreat:
          type: boolean
          description: Indicates that the entity has been determined to be a threat.
      description: Describes whether an entity is a threat or not.
      title: Threat
    Symbology:
      type: object
      properties:
        milStd2525C:
          $ref: '#/components/schemas/MilStd2525C'
      description: Symbology associated with an entity.
      title: Symbology
    TleParameters:
      type: object
      properties:
        ephemerisType:
          type: integer
          format: uint
          description: Integer specifying TLE ephemeris type
        classificationType:
          type: string
          description: User-defined free-text message classification/caveats of this TLE
        noradCatId:
          type: integer
          format: uint
          description: 'Norad catalog number: integer up to nine digits.'
        elementSetNo:
          type: integer
          format: uint
        revAtEpoch:
          type: integer
          format: uint
          description: 'Optional: revolution number'
        bstar:
          type: number
          format: double
          description: Drag parameter for SGP-4 in units 1 / Earth radii
        bterm:
          type: number
          format: double
          description: Drag parameter for SGP4-XP in units m^2 / kg
        meanMotionDot:
          type: number
          format: double
          description: First time derivative of mean motion in rev / day^2
        meanMotionDdot:
          type: number
          format: double
          description: Second time derivative of mean motion in rev / day^3. For use with SGP or PPT3.
        agom:
          type: number
          format: double
          description: Solar radiation pressure coefficient A_gamma / m in m^2 / kg. For use with SGP4-XP.
      title: TleParameters
    SecondaryCorrelation:
      type: object
      properties:
        primaryEntityId:
          type: string
          description: The primary of this correlation.
        metadata:
          $ref: '#/components/schemas/CorrelationMetadata'
          description: Metadata about the correlation.
      title: SecondaryCorrelation
    CorrelationMetadataReplicationMode:
      type: string
      enum:
      - CORRELATION_REPLICATION_MODE_INVALID
      - CORRELATION_REPLICATION_MODE_LOCAL
      - CORRELATION_REPLICATION_MODE_GLOBAL
      description: "Indicates how the correlation will be distributed. Because a correlation is composed of\n multiple secondaries, each of which may have been correlated with different replication\n modes, the distribution of the correlation is composed of distributions of the individual\n entities within the correlation set.\n For example, if there are two secondary entities A and B correlated against a primary C,\n with A having been correlated globally and B having been correlated locally, then the\n correlation set that is distributed globally than what is known locally in the node."
      title: CorrelationMetadataReplicationMode
    TrackedBy:
      type: object
      properties:
        activelyTrackingSensors:
          $ref: '#/components/schemas/Sensors'
          description: "Sensor details of the tracking entity's sensors that were active and tracking the tracked entity. This may be\n a subset of the total sensors available on the tracking entity."
        lastMeasurementTimestamp:
          type: string
          format: date-time
          description: Latest time that any sensor in actively_tracking_sensors detected the tracked entity.
      description: "Describes the relationship between the entity being tracked (\"tracked entity\") and the entity that is\n performing the tracking (\"tracking entity\")."
      title: TrackedBy
    VisualDetails:
      type: object
      properties:
        rangeRings:
          $ref: '#/components/schemas/RangeRings'
          description: The range rings to display around an entity.
      description: Visual details associated with the display of an entity in the client.
      title: VisualDetails
  securitySchemes:
    OAuth:
      type: http
      scheme: bearer
