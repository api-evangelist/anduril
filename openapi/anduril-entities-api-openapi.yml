      description: A representation of a single emitter notation.
      title: EmitterNotation
    ListOperation:
      type: object
      properties:
        listPath:
          type: string
          description: The list_path specifies the repeated field on an entity to which this operation applies.
        listComparator:
          $ref: '#/components/schemas/ListOperationListComparator'
          description: "The list_comparator specifies how to compose the boolean results from the child statement\n for each member of the specified list."
        statement:
          $ref: '#/components/schemas/Statement'
          description: "The statement is a new expression tree conceptually rooted at type of the list. It determines\n how each member of the list is evaluated."
      description: "The ListOperation represents an operation against a proto list. If the list is of primitive proto\n type (e.g. int32), paths in all child predicates should be left empty. If the list is of message\n proto type (e.g. Sensor), paths in all child predicates should be relative to the list path.\n\n For example, the criteria \"take an action if an entity has any sensor with sensor_id='sensor' and\n OperationalState=STATE_OFF\" would be modeled as:\n Predicate1: { path: \"sensor_id\", comparator: EQUAL_TO, value: \"sensor\" }\n Predicate2: { path: \"operational_state\", comparator: EQUAL_TO, value: STATE_OFF }\n\n Statement2: { AndOperation: PredicateSet: { <Predicate1>, <Predicate2> } }\n ListOperation: { list_path: \"sensors.sensors\", list_comparator: ANY, statement: <Statement2> }\n Statement1: { ListOperation: <ListOperation> }\n\n Note that in the above, the child predicates of the list operation have paths relative to the\n list_path because the list is comprised of message not primitive types."
      title: ListOperation
    MediaItem:
      type: object
      properties:
        itemIdentifier:
