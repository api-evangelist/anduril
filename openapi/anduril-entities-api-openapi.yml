    StatementSet:
      type: object
      properties:
        statements:
          type: array
          items:
            $ref: '#/components/schemas/Statement'
      description: "The StatementSet represents a list of statements or \"tree nodes,\" each of which follow the same\n behavior as the Statement proto message."
      title: StatementSet
    Sensor:
      type: object
      properties:
        sensorId:
          type: string
          description: This generally is used to indicate a specific type at a more detailed granularity. E.g. COMInt or LWIR
        operationalState:
          $ref: '#/components/schemas/SensorOperationalState'
        sensorType:
          $ref: '#/components/schemas/SensorSensorType'
          description: The type of sensor
        sensorDescription:
          type: string
          description: A human readable description of the sensor
        rfConfiguraton:
          $ref: '#/components/schemas/RFConfiguration'
          description: RF configuration details of the sensor
        lastDetectionTimestamp:
          type: string
          format: date-time
          description: Time of the latest detection from the sensor
        fieldsOfView:
          type: array
          items:
            $ref: '#/components/schemas/FieldOfView'
          description: Multiple fields of view for a single sensor component
      description: Individual sensor configuration.
      title: Sensor
    EntityEventRequest:
      type: object
      properties:
        sessionToken:
          type: string
          description: Long-poll session identifier. Leave empty to start a new polling session.
        batchSize:
          type: integer
          description: Maximum size of response batch. Defaults to 100. Must be between 1 and 2000 (inclusive).
      required:
      - sessionToken
      title: EntityEventRequest
    GroupChild:
      type: object
      properties: {}
      description: "A GroupChild relationship is a uni-directional relationship indicating that (1) this entity\n represents an Entity Group and (2) the related entity is a child member of this group. The presence of this\n relationship alone determines that the type of group is an Entity Group."
      title: GroupChild
    FrequencyRange:
      type: object
      properties:
        minimumFrequencyHz:
          $ref: '#/components/schemas/Frequency'
          description: Indicates the lowest measured frequency of a signal (Hz).
        maximumFrequencyHz:
          $ref: '#/components/schemas/Frequency'
          description: Indicates the maximum measured frequency of a signal (Hz).
      description: A component to represent a frequency range.
      title: FrequencyRange
    FieldOfView:
      type: object
      properties:
        fovId:
          type: integer
          description: "The Id for one instance of a FieldOfView, persisted across multiple updates to provide continuity during\n smoothing. This is relevant for sensors where the dwell schedule is on the order of\n milliseconds, making multiple FOVs a requirement for proper display of search beams."
        mountId:
          type: string
          description: The Id of the mount the sensor is on.
        projectedFrustum:
          $ref: '#/components/schemas/ProjectedFrustum'
          description: The field of view the sensor projected onto the ground.
        projectedCenterRay:
          $ref: '#/components/schemas/Position'
          description: Center ray of the frustum projected onto the ground.
        centerRayPose:
          $ref: '#/components/schemas/EntityManager.Pose'
          description: "The origin and direction of the center ray for this sensor relative to the ENU frame. A ray which is aligned with\n the positive X axis in the sensor frame will be transformed into the ray along the sensor direction in the ENU\n frame when transformed by the quaternion contained in this pose."
        horizontalFov:
          type: string
          title: float
          description: Horizontal field of view in radians.
        verticalFov:
          type: string
          title: float
          description: Vertical field of view in radians.
        range:
          type: string
          title: float
          description: Sensor range in meters.
        mode:
          $ref: '#/components/schemas/FieldOfViewMode'
          description: "The mode that this sensor is currently in, used to display for context in the UI. Some sensors can emit multiple\n sensor field of views with different modes, for example a radar can simultaneously search broadly and perform\n tighter bounded tracking."
      description: Sensor Field Of View closely resembling fov.proto SensorFieldOfView.
      title: FieldOfView
    GroupDetails:
      type: object
      properties:
        team:
          $ref: '#/components/schemas/Team'
        platformSubcomponents:
          $ref: '#/components/schemas/PlatformSubcomponents'
        echelon:
          $ref: '#/components/schemas/Echelon'
      description: Details related to grouping for this entity
      title: GroupDetails
    AcmDetailsAcmType:
      type: string
      enum:
      - ACM_DETAIL_TYPE_INVALID
      - ACM_DETAIL_TYPE_LANDING_ZONE
      title: AcmDetailsAcmType
    MergedFrom:
      type: object
      properties: {}
      description: "A MergedFrom relationship is a uni-directional relationship indicating that this entity is a merged entity whose\n data has at least partially been merged from the related entity."
      title: MergedFrom
    NotOperation:
      type: object
      properties:
        predicate:
          $ref: '#/components/schemas/Predicate'
        statement:
          $ref: '#/components/schemas/Statement'
      description: "The NotOperation represents the boolean NOT operation, which can only be applied to a single\n child predicate or statement."
      title: NotOperation
    Orbit:
      type: object
      properties:
        orbitMeanElements:
          $ref: '#/components/schemas/OrbitMeanElements'
          description: Orbit Mean Elements data, analogous to the Orbit Mean Elements Message in CCSDS 502.0-B-3
      title: Orbit
    Entity:
      type: object
      properties:
        entityId:
          type: string
          description: "A Globally Unique Identifier (GUID) for your entity. This is a required\n field."
        description:
          type: string
          description: "A human-readable entity description that's helpful for debugging purposes and human\n traceability. If this field is empty, the Entity Manager API generates one for you."
        isLive:
          type: boolean
          description: "Indicates the entity is active and should have a lifecycle state of CREATE or UPDATE.\n Set this field to true when publishing an entity."
        createdTime:
          type: string
          format: date-time
          description: "The time when the entity was first known to the entity producer. If this field is empty, the Entity Manager API uses the\n current timestamp of when the entity is first received.\n For example, when a drone is first powered on, it might report its startup time as the created time.\n The timestamp doesn't change for the lifetime of an entity."
        expiryTime:
          type: string
          format: date-time
          description: "Future time that expires an entity and updates the is_live flag.\n For entities that are constantly updating, the expiry time also updates.\n In some cases, this may differ from is_live.\n Example: Entities with tasks exported to an external system must remain\n active even after they expire.\n This field is required when publishing a prepopulated entity.\n The expiry time must be in the future, but less than 30 days from the current time."
        noExpiry:
          type: boolean
          description: "Use noExpiry only when the entity contains information that should be available to other\n tasks or integrations beyond its immediate operational context. For example, use noExpiry\n for long-living geographical entities that maintain persistent relevance across multiple\n operations or tasks."
        status:
          $ref: '#/components/schemas/Status'
          description: Human-readable descriptions of what the entity is currently doing.
        location:
          $ref: '#/components/schemas/Location'
          description: "Geospatial data related to the entity, including its position, kinematics, and orientation. Populate either\n this field (and `location_uncertainty`) or `kinematics`, not both. Populating both can lead to conflicting or\n inconsistent kinematics data for the entity."
        locationUncertainty:
          $ref: '#/components/schemas/LocationUncertainty'
          description: Indicates uncertainty of the entity's position and kinematics.
        kinematics:
          $ref: '#/components/schemas/Kinematics'
          description: "Kinematics data related to the entity to a higher degree of granularity than Location. This is preferred for Track Entities.\n Populate either `location`/`location_uncertainty` or this field, not both.\n Populating both can lead to conflicting or inconsistent kinematics data for the entity."
        geoShape:
          $ref: '#/components/schemas/GeoShape'
          description: Geospatial representation of the entity, including entities that cover an area rather than a fixed point.
        geoDetails:
          $ref: '#/components/schemas/GeoDetails'
          description: Additional details on what the geospatial area or point represents, along with visual display details.
        aliases:
          $ref: '#/components/schemas/Aliases'
          description: Entity name displayed in the Lattice UI side panel. Also includes identifiers that other systems can use to reference the same entity.
        tracked:
          $ref: '#/components/schemas/Tracked'
          description: If this entity is tracked by another entity, this component contains data related to how it's being tracked.
        correlation:
          $ref: '#/components/schemas/Correlation'
          description: If this entity has been correlated or decorrelated to another one, this component contains information on the correlation or decorrelation.
        milView:
          $ref: '#/components/schemas/MilView'
          description: View of the entity.
        ontology:
          $ref: '#/components/schemas/Ontology'
          description: Ontology defines an entity's categorization in Lattice, and improves data retrieval and integration. Builds a standardized representation of the entity.
        sensors:
          $ref: '#/components/schemas/Sensors'
          description: Details an entity's available sensors.
        payloads:
          $ref: '#/components/schemas/Payloads'
          description: Details an entity's available payloads.
        powerState:
          $ref: '#/components/schemas/PowerState'
          description: Details the entity's power source.
        provenance:
          $ref: '#/components/schemas/Provenance'
          description: The primary data source provenance for this entity.
        overrides:
          $ref: '#/components/schemas/Overrides'
          description: Provenance of override data.
        indicators:
          $ref: '#/components/schemas/Indicators'
          description: "Describes an entity's specific characteristics and the operations that can be performed on the entity.\n For example, \"simulated\" informs the operator that the entity is from a simulation, and \"deletable\"\n informs the operator (and system) that the delete operation is valid against the entity."
        targetPriority:
          $ref: '#/components/schemas/TargetPriority'
          description: The prioritization associated with an entity, such as if it's a threat or a high-value target.
        signal:
          $ref: '#/components/schemas/Signal'
          description: Describes an entity's signal characteristics, primarily used when an entity is a signal of interest.
        transponderCodes:
          $ref: '#/components/schemas/TransponderCodes'
          description: A message describing any transponder codes associated with Mode 1, 2, 3, 4, 5, S, C interrogations. These are related to ADS-B modes.
        dataClassification:
          $ref: '#/components/schemas/Classification'
          description: "Describes an entity's security classification levels at an overall classification level and on a per\n field level."
        taskCatalog:
          $ref: '#/components/schemas/TaskCatalog'
          description: A catalog of tasks that can be performed by an entity.
        media:
          $ref: '#/components/schemas/Media'
          description: Media associated with an entity, such as videos, images, or thumbnails.
        relationships:
          $ref: '#/components/schemas/Relationships'
          description: The relationships between this entity and other entities in the common operational picture (COP).
        visualDetails:
          $ref: '#/components/schemas/VisualDetails'
          description: Visual details associated with the display of an entity in the client.
        dimensions:
          $ref: '#/components/schemas/Dimensions'
          description: Physical dimensions of the entity.
        routeDetails:
          $ref: '#/components/schemas/RouteDetails'
          description: Additional information about an entity's route.
        schedules:
          $ref: '#/components/schemas/Schedules'
          description: Schedules associated with this entity.
        health:
          $ref: '#/components/schemas/Health'
          description: Health metrics or connection status reported by the entity.
        groupDetails:
          $ref: '#/components/schemas/GroupDetails'
          description: Details for the group associated with this entity.
        supplies:
          $ref: '#/components/schemas/Supplies'
          description: Contains relevant supply information for the entity, such as fuel.
        orbit:
          $ref: '#/components/schemas/Orbit'
          description: Orbit information for space objects.
        symbology:
          $ref: '#/components/schemas/Symbology'
          description: Symbology/iconography for the entity respecting an existing standard.
      description: "The entity object represents a single known object within the Lattice operational environment. It contains\n all data associated with the entity, such as its name, ID, and other relevant components."
      title: Entity
    AlertCondition:
      type: object
      properties:
        conditionCode:
          type: string
          description: "Short, machine-readable code that describes this condition. This code is intended to provide systems off-asset\n with a lookup key to retrieve more detailed information about the condition."
        description:
          type: string
          description: "Human-readable description of this condition. The description is intended for display in the UI for human\n understanding and should not be used for machine processing. If the description is fixed and the vehicle controller\n provides no dynamic substitutions, then prefer lookup based on condition_code."
      description: A condition which may trigger an alert.
      title: AlertCondition
    FieldClassificationInformation:
      type: object
      properties:
        fieldPath:
          type: string
          description: "Proto field path which is the string representation of a field.\n > example: signal.bandwidth_hz would be bandwidth_hz in the signal component"
        classificationInformation:
          $ref: '#/components/schemas/ClassificationInformation'
          description: The information which makes up the field level classification marking.
      description: A field specific classification information definition.
      title: FieldClassificationInformation
    Schedules:
      type: object
      properties:
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'
      description: Schedules associated with this entity
      title: Schedules
    Altitude:
      type: object
      properties:
        haeWgs84:
          $ref: '#/components/schemas/AltitudeAboveWGS84Ellipsoid'
        asf:
          $ref: '#/components/schemas/AltitudeAboveSeaFloor'
        bss:
          $ref: '#/components/schemas/AltitudeBelowSeaSurface'
        pressureSdp:
          $ref: '#/components/schemas/AltitudeAboveStandardDatumPlanePressure'
        pressureAmsl:
          $ref: '#/components/schemas/AltitudeAboveMeanSeaLevelPressure'
        egm96Amsl:
          $ref: '#/components/schemas/AltitudeAboveMeanSeaLevelEGM96'
        agl:
          $ref: '#/components/schemas/AltitudeAboveGroundLevel'
      title: Altitude
    HealthHealthStatus:
      type: string
      enum:
      - HEALTH_STATUS_INVALID
      - HEALTH_STATUS_HEALTHY
      - HEALTH_STATUS_WARN
      - HEALTH_STATUS_FAIL
      - HEALTH_STATUS_OFFLINE
      - HEALTH_STATUS_NOT_READY
      description: Top-level health status; typically a roll-up of individual component healths.
      title: HealthHealthStatus
    BooleanType:
      type: object
      properties:
        value:
          type: boolean
      description: The BooleanType represents a static boolean value.
      title: BooleanType
    EntityEventEventType:
      type: string
      enum:
      - EVENT_TYPE_INVALID
      - EVENT_TYPE_CREATED
      - EVENT_TYPE_UPDATE
      - EVENT_TYPE_DELETED
      - EVENT_TYPE_PREEXISTING
      - EVENT_TYPE_POST_EXPIRY_OVERRIDE
      title: EntityEventEventType
    ProjectedFrustum:
      type: object
      properties:
        upperLeft:
          $ref: '#/components/schemas/Position'
          description: Upper left point of the frustum.
        upperRight:
          $ref: '#/components/schemas/Position'
          description: Upper right point of the frustum.
        bottomRight:
          $ref: '#/components/schemas/Position'
          description: Bottom right point of the frustum.
        bottomLeft:
          $ref: '#/components/schemas/Position'
          description: Bottom left point of the frustum.
      description: "Represents a frustum in which which all four corner points project onto the ground. All points in this message\n are optional, if the projection to the ground fails then they will not be populated."
      title: ProjectedFrustum
    Classification:
      type: object
      properties:
        default:
          $ref: '#/components/schemas/ClassificationInformation'
          description: "The default classification information which should be assumed to apply to everything in\n the entity unless a specific field level classification is present."
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldClassificationInformation'
          description: "The set of individual field classification information which should always precedence\n over the default classification information."
      description: A component that describes an entity's security classification levels.
      title: Classification
    AlertLevel:
      type: string
      enum:
      - ALERT_LEVEL_INVALID
      - ALERT_LEVEL_ADVISORY
      - ALERT_LEVEL_CAUTION
      - ALERT_LEVEL_WARNING
      description: Alert level (Warning, Caution, or Advisory).
      title: AlertLevel
    MilViewDisposition:
      type: string
      enum:
      - DISPOSITION_UNKNOWN
      - DISPOSITION_FRIENDLY
      - DISPOSITION_HOSTILE
      - DISPOSITION_SUSPICIOUS
      - DISPOSITION_ASSUMED_FRIENDLY
      - DISPOSITION_NEUTRAL
      - DISPOSITION_PENDING
      title: MilViewDisposition
    Predicate:
      type: object
      properties:
        fieldPath:
          type: string
          description: "The field_path determines which field on an entity is being referenced in this predicate. For\n example: correlated.primary_entity_id would be primary_entity_id in correlated component."
        value:
          $ref: '#/components/schemas/Value'
          description: "The value determines the fixed value against which the entity field is to be compared.\n In the case of COMPARATOR_MATCH_ALL, the value contents do not matter as long as the Value is a supported\n type."
        comparator:
          $ref: '#/components/schemas/PredicateComparator'
          description: "The comparator determines the manner in which the entity field and static value are compared.\n Comparators may only be applied to certain values. For example, the WITHIN comparator cannot\n be used for a boolean value comparison."
      description: "The Predicate fully encodes the information required to make an evaluation of an entity field\n against a given static value, resulting in a boolean TRUE/FALSE result. The structure of a\n predicate will always follow: \"{entity-value} {comparator} {fixed-value}\" where the entity value\n is determined by the field path.\n\n For example, a predicate would read as: \"{entity.location.velocity_enu} {LESS_THAN} {500kph}\""
      title: Predicate
    PositionType:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/Position'
      description: The PositionType represents any fixed LLA point in space.
      title: PositionType
    NonPrimaryMembership:
      type: object
      properties: {}
      title: NonPrimaryMembership
    TransponderCodesMode4InterrogationResponse:
      type: string
      enum:
      - INTERROGATION_RESPONSE_INVALID
      - INTERROGATION_RESPONSE_CORRECT
      - INTERROGATION_RESPONSE_INCORRECT
      - INTERROGATION_RESPONSE_NO_RESPONSE
      description: The validity of the response from the Mode 4 interrogation.
      title: TransponderCodesMode4InterrogationResponse
    ComponentMessage:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ComponentMessageStatus'
          description: The status associated with this message.
        message:
          type: string
          description: The human-readable content of the message.
      description: A message describing the component's health status.
      title: ComponentMessage
    Tracked:
      type: object
      properties:
        trackQualityWrapper:
          type: integer
          description: Quality score, 0-15, nil if none
        sensorHits:
          type: integer
          description: Sensor hits aggregation on the tracked entity.
        numberOfObjects:
          $ref: '#/components/schemas/UInt32Range'
          description: "Estimated number of objects or units that are represented by this entity. Known as Strength in certain contexts (Link16)\n if UpperBound == LowerBound; (strength = LowerBound)\n If both UpperBound and LowerBound are defined; strength is between LowerBound and UpperBound (represented as string \"Strength: 4-5\")\n If UpperBound is defined only (LowerBound unset), Strength ≤ UpperBound\n If LowerBound is defined only (UpperBound unset), LowerBound ≤ Strength\n 0 indicates unset."
        radarCrossSection:
          type: number
          format: double
          description: "The radar cross section (RCS) is a measure of how detectable an object is by radar. A large RCS indicates an object is more easily\n detected. The unit is “decibels per square meter,” or dBsm"
        lastMeasurementTime:
          type: string
          format: date-time
          description: Timestamp of the latest tracking measurement for this entity.
        lineOfBearing:
          $ref: '#/components/schemas/LineOfBearing'
          description: "The relative position of a track with respect to the entity that is tracking it. Used for tracks that do not yet have a 3D position.\n For this entity (A), being tracked by some entity (B), this LineOfBearing would express a ray from B to A."
      description: Available for Entities that are tracked.
      title: Tracked
    EntityManager.TMat3:
      type: object
      properties:
        mxx:
          type: string
          title: float
        mxy:
          type: string
          title: float
        mxz:
          type: string
          title: float
        myy:
          type: string
          title: float
        myz:
          type: string
          title: float
        mzz:
          type: string
          title: float
      description: Symmetric 3d matrix only representing the upper right triangle.
      title: EntityManager.TMat3
    KinematicsGeodetic:
      type: object
      properties:
        location:
          $ref: '#/components/schemas/LocationGeodetic'
          description: The location of this entity.
        locationUncertaintyEnu:
          $ref: '#/components/schemas/TMat3'
          description: "Location uncertainty of this measurement, measured in the ENU frame. When there are multiple altitude\n measurements, this represents the most certain."
        velocityEnuMPerS:
          $ref: '#/components/schemas/Vec3'
          description: Velocity in the ENU frame, measured in meters per second.
        velocityUncertaintyEnu:
          $ref: '#/components/schemas/TMat3'
          description: A 3x3 covariance matrix representing the uncertainty of the velocity measurement.
        accelerationMPerS2:
          $ref: '#/components/schemas/Vec3'
          description: The entity's acceleration in meters per second squared.
        attitudeEnu:
          $ref: '#/components/schemas/Quaternion'
          description: "Quaternion that rotates the X unit vector in the entity's body frame (assumed to be front-left-up) [1,0,0]\n to the entity's orientation unit vector in the ENU frame at the entity's location."
        measurementTime:
          type: string
          format: date-time
          description: "The time when these kinematics were measured by the sensor. For tracks, this represents when the sensor made\n the observation that produced these kinematics. For asset pose data, this represents the system time when the\n pose was captured."
      title: KinematicsGeodetic
    AltitudeAboveSeaFloor:
      type: object
      properties:
        provenance:
          $ref: '#/components/schemas/AltitudeProvenance'
          description: The provenance of the measurement.
        valueMeters:
          type: number
          format: double
          description: The altitude value in meters.
      description: The altitude above the sea floor, generally measured with a sonar.
      title: AltitudeAboveSeaFloor
    AltitudeAboveMeanSeaLevelEGM96:
      type: object
      properties:
        provenance:
          $ref: '#/components/schemas/AltitudeProvenance'
          description: The provenance of the measurement.
        valueMeters:
          type: number
          format: double
          description: The altitude value in meters.
      description: "The altitude relative to mean sea level represented by the EGM96 geoid. This is often calculated using a terrain\n conversion of from a GNSS device."
      title: AltitudeAboveMeanSeaLevelEGM96
    OverrideStatus:
      type: string
      enum:
      - OVERRIDE_STATUS_INVALID
      - OVERRIDE_STATUS_APPLIED
      - OVERRIDE_STATUS_PENDING
      - OVERRIDE_STATUS_TIMEOUT
      - OVERRIDE_STATUS_REJECTED
      - OVERRIDE_STATUS_DELETION_PENDING
      description: status of the override
      title: OverrideStatus
    PayloadConfiguration:
      type: object
      properties:
        capabilityId:
          type: string
          description: "Identifying ID for the capability.\n This ID may be used multiple times to represent payloads that are the same capability but have different operational states"
        quantity:
          type: integer
          format: uint
          description: The number of payloads currently available in the configuration.
        effectiveEnvironment:
          type: array
          items:
            $ref: '#/components/schemas/PayloadConfigurationEffectiveEnvironmentItems'
          description: The target environments the configuration is effective against.
        payloadOperationalState:
          $ref: '#/components/schemas/PayloadConfigurationPayloadOperationalState'
          description: The operational state of this payload.
        payloadDescription:
          type: string
          description: A human readable description of the payload
      title: PayloadConfiguration
    OrOperation:
      type: object
      properties:
        predicateSet:
          $ref: '#/components/schemas/PredicateSet'
        statementSet:
          $ref: '#/components/schemas/StatementSet'
      description: "The OrOperation represents the boolean OR operation, which is to be applied to the list of\n children statement(s) or predicate(s)."
      title: OrOperation
    SensorOperationalState:
      type: string
      enum:
      - OPERATIONAL_STATE_INVALID
      - OPERATIONAL_STATE_OFF
      - OPERATIONAL_STATE_NON_OPERATIONAL
      - OPERATIONAL_STATE_DEGRADED
      - OPERATIONAL_STATE_OPERATIONAL
      - OPERATIONAL_STATE_DENIED
      title: SensorOperationalState
    GroupParent:
      type: object
      properties: {}
      description: "A GroupParent relationship is a uni-directional relationship indicating that this entity is a member of\n the Entity Group represented by the related entity. The presence of this relationship alone determines that\n the type of group that this entity is a member of is an Entity Group."
      title: GroupParent
    LocationUncertainty:
      type: object
      properties:
        positionEnuCov:
          $ref: '#/components/schemas/EntityManager.TMat3'
          description: "Positional covariance represented by the upper triangle of the covariance matrix. It is valid to populate\n only the diagonal of the matrix if the full covariance matrix is unknown."
        velocityEnuCov:
          $ref: '#/components/schemas/EntityManager.TMat3'
          description: "Velocity covariance represented by the upper triangle of the covariance matrix. It is valid to populate\n only the diagonal of the matrix if the full covariance matrix is unknown."
        positionErrorEllipse:
          $ref: '#/components/schemas/ErrorEllipse'
          description: An ellipse that describes the certainty probability and error boundary for a given geolocation.
      description: Uncertainty of entity position and velocity, if available.
      title: LocationUncertainty
    NumericType:
      type: object
      properties:
        doubleValue:
          type: number
          format: double
        floatValue:
          type: string
          title: float
        int32Value:
          type: integer
        int64Value:
          type: string
        uint32Value:
          type: integer
          format: uint
        uint64Value:
          type: string
      description: "The NumericType represents static numeric values. It supports all numeric primitives supported\n by the proto3 language specification."
      title: NumericType
    Indicators:
      type: object
      properties:
        simulated:
          type: boolean
        exercise:
          type: boolean
        emergency:
          type: boolean
        c2:
          type: boolean
        egressable:
          type: boolean
          description: "Indicates the Entity should be egressed to external sources.\n Integrations choose how the egressing happens (e.g. if an Entity needs fuzzing)."
        starred:
          type: boolean
          description: A signal of arbitrary importance such that the entity should be globally marked for all users
      description: Indicators to describe entity to consumers.
      title: Indicators
    AlternateId:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/AlternateIdType'
      description: An alternate id for an Entity.
      title: AlternateId
    Timestamp:
      type: string
