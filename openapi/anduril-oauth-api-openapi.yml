openapi: 3.2.0
info:
  title: REST OAuth API
  version: 1.0.0
servers:
- url: https://example.developer.anduril.com
  description: https://{server}
tags:
- name: OAuth
paths:
  /api/v1/oauth/token:
    post:
      operationId: oauth_getToken
      summary: Get OAuth2 token
      description: Gets a new short-lived token using the specified client credentials
      tags:
      - OAuth
      responses:
        '200':
          description: Access token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth_getToken_Response_200'
        '400':
          description: Bad request or invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTokenRequestBadRequestError'
        '401':
          description: Unauthorized - client authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTokenRequestUnauthorizedError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                  - client_credentials
                  description: The type of grant being requested
                client_id:
                  type: string
                  description: The client identifier
                client_secret:
                  type: string
                  format: password
                  description: The client secret
              required:
              - grant_type
      security:
      - OAuth: []
components:
  schemas:
    GetTokenRequestBadRequestError:
      type: object
      properties:
        error:
          type: string
        error_description:
          type: string
      required:
      - error
      title: GetTokenRequestBadRequestError
    oauth_getToken_Response_200:
      type: object
      properties:
        access_token:
          type: string
          description: The access token
        token_type:
          type: string
          description: The type of token (typically "Bearer")
        expires_in:
          type: integer
          description: Lifetime of the access token in seconds
        refresh_expires_in:
          type: integer
          description: Lifetime of the refresh token
        not-before-policy:
          type: integer
          description: Enforce that a token cannot be used before a specific unixtime
        scope:
          type: string
          description: The scope of the access token
      required:
      - access_token
      - token_type
      title: oauth_getToken_Response_200
    GetTokenRequestUnauthorizedError:
      type: object
      properties:
        error:
          type: string
        error_description:
          type: string
      required:
      - error
      title: GetTokenRequestUnauthorizedError
  securitySchemes:
    OAuth:
      type: http
      scheme: bearer
x-provenance:
  method: harvested
  publisher: Anduril Industries
  source: https://developer.anduril.com/openapi.json
